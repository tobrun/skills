<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #ffffff;
    --text: #0b0b0b; --text-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --border: rgba(11,11,11,0.10); --accent: #2a78d6;
    --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
    --shadow: 0 1px 2px rgba(11,11,11,0.06), 0 4px 16px rgba(11,11,11,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark; --page: #0d0d0d; --surface: #1a1a19; --surface-2: #202020;
      --text: #ffffff; --text-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a;
      --border: rgba(255,255,255,0.10); --accent: #3987e5;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark; --page: #0d0d0d; --surface: #1a1a19; --surface-2: #202020;
    --text: #ffffff; --text-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a;
    --border: rgba(255,255,255,0.10); --accent: #3987e5;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--page); color: var(--text); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 20px 100px; }
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; background: color-mix(in srgb, var(--page) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  .topbar .brand { font-weight: 600; font-size: 13px; color: var(--text-2); letter-spacing: 0.02em; }
  .icon-btn { border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  .icon-btn:hover { color: var(--text); border-color: var(--muted); }
  header.hero { padding: 36px 0 8px; }
  header.hero h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -0.01em; }
  .gate-note { font-size: 13px; color: var(--text-2); background: color-mix(in srgb, var(--warning) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warning) 40%, var(--border)); border-radius: 8px; padding: 8px 12px; }
  section { margin: 28px 0; }
  h2.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 12px; font-weight: 700; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; box-shadow: var(--shadow); }
  .q-card { margin-bottom: 14px; }
  .q-prompt { font-weight: 600; margin-bottom: 10px; }
  .q-choice { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; cursor: pointer; background: var(--surface-2); }
  .q-choice:hover { border-color: var(--muted); }
  .q-choice input { accent-color: var(--accent); }
  .q-card.graded .q-choice { cursor: default; }
  .q-card.graded .q-choice.correct { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--surface-2)); }
  .q-card.graded .q-choice.wrong-pick { border-color: var(--critical); background: color-mix(in srgb, var(--critical) 12%, var(--surface-2)); }
  .q-explain { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); font-size: 13.5px; color: var(--text-2); }
  .q-card.graded .q-explain { display: block; }
  .q-source { font-size: 12px; margin-top: 4px; }
  .q-source a { color: var(--muted); }
  .files-touched { margin: 8px 0 0; padding: 0; list-style: none; font-size: 12.5px; color: var(--muted); }
  .files-touched li { font-family: ui-monospace, monospace; padding: 1px 0; }
  #grade-btn { border: none; background: var(--accent); color: #fff; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 700; cursor: pointer; }
  #grade-btn:hover { opacity: 0.9; }
  #summary-card { display: none; text-align: center; }
  #summary-card.show { display: block; }
  #summary-score { font-size: 32px; font-weight: 800; margin: 4px 0; }
  #summary-score.pass { color: var(--good); }
  #summary-score.fail { color: var(--critical); }
  #summary-note { color: var(--text-2); font-size: 13.5px; }
</style>
</head>
<body>
  <div class="topbar">
    <span class="brand">QUIZ</span>
    <button class="icon-btn" id="theme-toggle" type="button">Theme</button>
  </div>

  <div class="wrap">
    <header class="hero">
      <h1 id="q-title"></h1>
      <div class="gate-note">This is a comprehension check the reader takes themselves - it cannot block a merge on its own. Do not merge until it's genuinely green, and wire up real enforcement (a PR checklist item, branch protection) separately if you want one.</div>
    </header>

    <section id="context">
      <h2 class="section-title">Context</h2>
      <div class="card" id="ctx-text"></div>
    </section>

    <section id="intuition">
      <h2 class="section-title">Intuition</h2>
      <div class="card" id="intuition-text"></div>
    </section>

    <section id="what-was-done">
      <h2 class="section-title">What was done</h2>
      <div class="card">
        <div id="what-text"></div>
        <ul class="files-touched" id="what-files"></ul>
      </div>
    </section>

    <section>
      <h2 class="section-title">Quiz</h2>
      <div id="questions-list"></div>
      <button id="grade-btn" type="button">Check my answers</button>
      <div class="card" id="summary-card">
        <div id="summary-score"></div>
        <div id="summary-note"></div>
      </div>
    </section>
  </div>

<script>
/* QUIZ_DATA_START - replace everything between these two markers with the real quiz data */
const QUIZ_DATA = {
  title: "Example: One-click deploy rollback",
  planName: "one-click-rollback",
  generatedAt: "2026-01-01",
  context: "Placeholder - replace QUIZ_DATA before sharing this file.",
  intuition: "Placeholder.",
  whatWasDone: { summary: "Placeholder.", filesTouched: [] },
  questions: [
    {
      id: "q1",
      prompt: "Placeholder question?",
      choices: ["Placeholder answer A", "Placeholder answer B", "Placeholder answer C"],
      correctIndex: 0,
      explanation: "Placeholder explanation.",
      linksToSection: "context"
    }
  ]
};
/* QUIZ_DATA_END */

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function mdLite(s) {
  if (!s) return "";
  let h = escapeHtml(s);
  h = h.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  return h.split(/\n\n+/).map(p => "<p style='margin:0 0 8px'>" + p.replace(/\n/g, "<br>") + "</p>").join("");
}

(function themeInit() {
  const key = "to-quiz-theme";
  let saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
  document.getElementById("theme-toggle").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : cur === "light" ? null : "dark";
    if (next) document.documentElement.setAttribute("data-theme", next);
    else document.documentElement.removeAttribute("data-theme");
    try { next ? localStorage.setItem(key, next) : localStorage.removeItem(key); } catch (e) {}
  });
})();

document.getElementById("q-title").textContent = QUIZ_DATA.title || "Quiz";
document.title = (QUIZ_DATA.title || "Quiz") + " - quiz";
document.getElementById("ctx-text").innerHTML = mdLite(QUIZ_DATA.context || "");
document.getElementById("intuition-text").innerHTML = mdLite(QUIZ_DATA.intuition || "");
const whatWasDone = QUIZ_DATA.whatWasDone || {};
document.getElementById("what-text").innerHTML = mdLite(whatWasDone.summary || "");
const whatFiles = whatWasDone.filesTouched || [];
document.getElementById("what-files").innerHTML = whatFiles.length
  ? whatFiles.map(f => `<li>${escapeHtml(f)}</li>`).join("")
  : "<li style='list-style:none; margin-left:-20px; color:var(--muted)'>None listed.</li>";

const sectionLabels = { context: "Context", intuition: "Intuition", "what-was-done": "What was done" };

const questions = QUIZ_DATA.questions || [];
const list = document.getElementById("questions-list");
questions.forEach((q, qi) => {
  const el = document.createElement("div");
  el.className = "card q-card";
  el.dataset.qi = qi;
  el.innerHTML = `
    <div class="q-prompt">${qi + 1}. ${escapeHtml(q.prompt || "")}</div>
    <div class="q-choices">
      ${(q.choices || []).map((c, ci) => `
        <label class="q-choice" data-ci="${ci}">
          <input type="radio" name="q${qi}" value="${ci}">
          <span>${escapeHtml(c)}</span>
        </label>`).join("")}
    </div>
    <div class="q-explain">
      <div>${mdLite(q.explanation || "")}</div>
      <div class="q-source"><a href="#${escapeHtml(q.linksToSection || "context")}">${escapeHtml(sectionLabels[q.linksToSection] || "Context")} &uarr;</a></div>
    </div>`;
  list.appendChild(el);
});

document.getElementById("grade-btn").addEventListener("click", () => {
  let correct = 0;
  const missed = [];
  questions.forEach((q, qi) => {
    const card = list.querySelector(`.q-card[data-qi="${qi}"]`);
    const picked = card.querySelector(`input[name="q${qi}"]:checked`);
    const pickedIdx = picked ? Number(picked.value) : -1;
    card.classList.add("graded");
    card.querySelectorAll(".q-choice").forEach(choiceEl => {
      const ci = Number(choiceEl.dataset.ci);
      if (ci === q.correctIndex) choiceEl.classList.add("correct");
      if (ci === pickedIdx && ci !== q.correctIndex) choiceEl.classList.add("wrong-pick");
    });
    if (pickedIdx === q.correctIndex) correct++;
    else missed.push(qi + 1);
  });
  const summaryCard = document.getElementById("summary-card");
  const scoreEl = document.getElementById("summary-score");
  const noteEl = document.getElementById("summary-note");
  const pass = correct === questions.length;
  scoreEl.textContent = correct + " / " + questions.length;
  scoreEl.className = pass ? "pass" : "fail";
  noteEl.textContent = pass
    ? "All correct. This is a self-check, not an automated gate - use your own judgment on whether it's ready."
    : "Missed question" + (missed.length > 1 ? "s " : " ") + missed.join(", ") + " - read the explanation under each before merging.";
  summaryCard.classList.add("show");
  summaryCard.scrollIntoView({ behavior: "smooth", block: "center" });
});
</script>
</body>
</html>
