<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitch</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #ffffff;
    --text: #0b0b0b; --text-2: #52514e; --muted: #898781;
    --border: rgba(11,11,11,0.10);
    --shadow: 0 1px 2px rgba(11,11,11,0.06), 0 4px 16px rgba(11,11,11,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark; --page: #0d0d0d; --surface: #1a1a19; --surface-2: #202020;
      --text: #ffffff; --text-2: #c3c2b7; --muted: #898781;
      --border: rgba(255,255,255,0.10);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark; --page: #0d0d0d; --surface: #1a1a19; --surface-2: #202020;
    --text: #ffffff; --text-2: #c3c2b7; --muted: #898781;
    --border: rgba(255,255,255,0.10);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--page); color: var(--text); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 28px 20px 100px; }
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; background: color-mix(in srgb, var(--page) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  .topbar .brand { font-weight: 600; font-size: 13px; color: var(--text-2); letter-spacing: 0.02em; }
  .icon-btn { border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  .icon-btn:hover { color: var(--text); border-color: var(--muted); }
  header.hero { padding: 36px 0 8px; }
  header.hero h1 { font-size: 28px; margin: 0; letter-spacing: -0.01em; }
  section { margin: 30px 0; }
  h2.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 12px; font-weight: 700; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; box-shadow: var(--shadow); }
  .demo-card { padding: 0; overflow: hidden; }
  .demo-card img, .demo-card video { display: block; width: 100%; height: auto; }
  .demo-caption { padding: 12px 18px; font-size: 13.5px; color: var(--text-2); border-top: 1px solid var(--border); }
  .demo-text { padding: 28px 24px; font-size: 16px; color: var(--text); }
  .demo-empty { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 13.5px; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .split .card h3 { margin: 0 0 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .verify-row { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; }
  .verify-layers { display: flex; gap: 6px; margin-top: 8px; }
  .layer-chip { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 3px 9px; border-radius: 100px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); }
  .files-touched { margin: 8px 0 0; padding: 0; list-style: none; font-size: 12.5px; color: var(--muted); }
  .files-touched li { font-family: ui-monospace, monospace; padding: 1px 0; }
  .dev-item { border-bottom: 1px dashed var(--border); padding: 10px 0; }
  .dev-item:last-child { border-bottom: none; }
  .dev-item .what { font-weight: 600; margin-bottom: 3px; }
  .dev-item .why { color: var(--text-2); font-size: 13.5px; }
  .try-box ol { margin: 0; padding-left: 20px; }
  .try-box li { margin: 4px 0; }
  @media (max-width: 640px) { .split { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="topbar">
    <span class="brand">PITCH</span>
    <button class="icon-btn" id="theme-toggle" type="button">Theme</button>
  </div>

  <div class="wrap">
    <header class="hero"><h1 id="p-title"></h1></header>

    <section>
      <div class="card demo-card" id="demo-card"></div>
    </section>

    <section>
      <h2 class="section-title">Why</h2>
      <div class="split">
        <div class="card"><h3>Goal</h3><div id="why-goal"></div></div>
        <div class="card"><h3>Problem</h3><div id="why-problem"></div></div>
      </div>
    </section>

    <section>
      <h2 class="section-title">What changed</h2>
      <div class="split">
        <div class="card"><h3>Before</h3><div id="wc-before"></div></div>
        <div class="card"><h3>After</h3><div id="wc-after"></div></div>
        <div class="card full" style="grid-column:1/-1"><h3>Files touched</h3><ul class="files-touched" id="wc-files"></ul></div>
      </div>
    </section>

    <section>
      <h2 class="section-title">How we verified it</h2>
      <div class="card">
        <div class="verify-row"><span class="n" id="verify-summary"></span></div>
        <div class="verify-layers" id="verify-layers"></div>
      </div>
    </section>

    <section id="deviations-section" style="display:none">
      <h2 class="section-title">Deviations</h2>
      <div class="card" id="deviations-list"></div>
    </section>

    <section>
      <h2 class="section-title">Try it yourself</h2>
      <div class="card try-box"><ol id="try-steps"></ol></div>
    </section>
  </div>

<script>
/* PITCH_DATA_START - replace everything between these two markers with the real pitch data */
const PITCH_DATA = {
  title: "Example: One-click deploy rollback",
  planName: "one-click-rollback",
  generatedAt: "2026-01-01",
  demo: { gifDataUri: null, beforeAfterExample: "Placeholder - replace PITCH_DATA before sharing this file." },
  why: { goal: "Placeholder.", problem: "Placeholder." },
  whatChanged: { before: "Placeholder.", after: "Placeholder.", filesTouched: [] },
  howVerified: { e2eSummary: "0/0 e2e scenarios passing", layersCovered: [] },
  deviations: [],
  tryItYourself: { steps: ["Placeholder."] }
};
/* PITCH_DATA_END */

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function mdLite(s) {
  if (!s) return "";
  let h = escapeHtml(s);
  h = h.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  return h.split(/\n\n+/).map(p => "<p style='margin:0 0 8px'>" + p.replace(/\n/g, "<br>") + "</p>").join("");
}

(function themeInit() {
  const key = "to-pitch-theme";
  let saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
  document.getElementById("theme-toggle").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : cur === "light" ? null : "dark";
    if (next) document.documentElement.setAttribute("data-theme", next);
    else document.documentElement.removeAttribute("data-theme");
    try { next ? localStorage.setItem(key, next) : localStorage.removeItem(key); } catch (e) {}
  });
})();

document.getElementById("p-title").textContent = PITCH_DATA.title || "Pitch";
document.title = (PITCH_DATA.title || "Pitch") + " - pitch";

const demoCard = document.getElementById("demo-card");
const demo = PITCH_DATA.demo || {};
if (demo.gifDataUri) {
  demoCard.innerHTML = `<img src="${escapeHtml(demo.gifDataUri)}" alt="Demo of the change">`
    + (demo.beforeAfterExample ? `<div class="demo-caption">${mdLite(demo.beforeAfterExample)}</div>` : "");
} else if (demo.beforeAfterExample) {
  demoCard.innerHTML = `<div class="demo-text">${mdLite(demo.beforeAfterExample)}</div>`;
} else {
  demoCard.innerHTML = `<div class="demo-empty">No demo captured for this change.</div>`;
}

document.getElementById("why-goal").innerHTML = mdLite((PITCH_DATA.why || {}).goal || "");
document.getElementById("why-problem").innerHTML = mdLite((PITCH_DATA.why || {}).problem || "");
document.getElementById("wc-before").innerHTML = mdLite((PITCH_DATA.whatChanged || {}).before || "");
document.getElementById("wc-after").innerHTML = mdLite((PITCH_DATA.whatChanged || {}).after || "");
const filesTouched = (PITCH_DATA.whatChanged || {}).filesTouched || [];
document.getElementById("wc-files").innerHTML = filesTouched.length
  ? filesTouched.map(f => `<li>${escapeHtml(f)}</li>`).join("")
  : "<li style='list-style:none; margin-left:-20px; color:var(--muted)'>None listed.</li>";

const verify = PITCH_DATA.howVerified || {};
document.getElementById("verify-summary").textContent = verify.e2eSummary || "No verification evidence recorded.";
document.getElementById("verify-layers").innerHTML = (verify.layersCovered || [])
  .map(l => `<span class="layer-chip">${escapeHtml(l)}</span>`).join("");

const deviations = PITCH_DATA.deviations || [];
if (deviations.length) {
  document.getElementById("deviations-section").style.display = "block";
  document.getElementById("deviations-list").innerHTML = deviations.map(d =>
    `<div class="dev-item"><div class="what">${escapeHtml(d.what || "")}</div><div class="why">${mdLite(d.why || "")}</div></div>`
  ).join("");
}

const trySteps = (PITCH_DATA.tryItYourself || {}).steps || [];
document.getElementById("try-steps").innerHTML = trySteps.map(s => `<li>${mdLite(s)}</li>`).join("");
</script>
</body>
</html>
