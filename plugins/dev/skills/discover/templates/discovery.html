<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discovery</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --surface-2: #ffffff;
    --text: #0b0b0b;
    --text-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --border: rgba(11,11,11,0.10);
    --accent: #2a78d6;
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
    --shadow: 0 1px 2px rgba(11,11,11,0.06), 0 4px 16px rgba(11,11,11,0.06);
    --overlay: rgba(11,11,11,0.55);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --surface-2: #202020;
      --text: #ffffff;
      --text-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --border: rgba(255,255,255,0.10);
      --accent: #3987e5;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.4);
      --overlay: rgba(0,0,0,0.7);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #202020;
    --text: #ffffff;
    --text-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --border: rgba(255,255,255,0.10);
    --accent: #3987e5;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.4);
    --overlay: rgba(0,0,0,0.7);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 90px; }
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 20px; background: color-mix(in srgb, var(--page) 88%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
  }
  .topbar .brand { font-weight: 600; font-size: 13px; color: var(--text-2); letter-spacing: 0.02em; }
  .icon-btn {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2);
    border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--muted); }

  header.hero { padding: 36px 0 8px; }
  header.hero h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.01em; }
  header.hero .meta { font-size: 13px; color: var(--muted); }
  .mode-badges { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .mode-badge {
    font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 5px 11px; border-radius: 100px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--muted);
  }
  .mode-badge.ran { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); background: color-mix(in srgb, var(--accent) 10%, var(--surface-2)); }

  section { margin: 30px 0; }
  h2.section-title {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin: 0 0 12px; font-weight: 700;
  }
  h3.sub-title { font-size: 13px; color: var(--text-2); margin: 18px 0 10px; font-weight: 700; }
  h3.sub-title:first-child { margin-top: 0; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; box-shadow: var(--shadow);
  }
  .empty-note { color: var(--muted); font-size: 13.5px; }

  /* blind spot findings */
  .finding-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .finding {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .finding .primary { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .finding .detail { font-size: 13px; color: var(--text-2); }
  .finding .detail + .detail { margin-top: 4px; }
  .finding .detail b { color: var(--text); font-weight: 600; }

  /* intervention table */
  table.intervention { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.intervention th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted); font-weight: 700; padding: 0 10px 8px; border-bottom: 1px solid var(--grid);
  }
  table.intervention td { padding: 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  table.intervention tr:last-child td { border-bottom: none; }
  .effort-pill { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 100px; white-space: nowrap; display: inline-block; }
  .effort-pill.cheap { background: color-mix(in srgb, var(--good) 18%, var(--surface)); color: color-mix(in srgb, var(--good) 65%, #063600); }
  .effort-pill.moderate { background: color-mix(in srgb, var(--warning) 22%, var(--surface)); color: color-mix(in srgb, var(--warning) 70%, #3a2a00); }
  .effort-pill.ambitious { background: color-mix(in srgb, var(--critical) 16%, var(--surface)); color: var(--critical); }

  /* mockup gallery */
  .mockup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .mockup { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow); cursor: zoom-in; }
  .mockup iframe { width: 100%; height: 240px; border: 0; display: block; background: #fff; pointer-events: none; }
  .mockup .meta { padding: 10px 12px; }
  .mockup .meta h3 { margin: 0 0 3px; font-size: 13.5px; }
  .mockup .meta p { margin: 0; font-size: 12.5px; color: var(--text-2); }
  .lightbox {
    display: none; position: fixed; inset: 0; z-index: 40; background: var(--overlay);
    align-items: center; justify-content: center; padding: 30px;
  }
  .lightbox.show { display: flex; }
  .lightbox-inner {
    background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden;
    width: min(880px, 100%); max-height: 90vh; display: flex; flex-direction: column;
  }
  .lightbox-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .lightbox-head h3 { margin: 0; font-size: 14.5px; }
  .lightbox-head p { margin: 2px 0 0; font-size: 12.5px; color: var(--text-2); }
  .lightbox iframe { width: 100%; height: min(70vh, 640px); border: 0; display: block; background: #fff; }
  .lightbox-close { border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  .lightbox-close:hover { color: var(--text); border-color: var(--muted); }

  /* interview */
  .qa { border-left: 3px solid var(--border); padding: 4px 0 4px 14px; margin-bottom: 14px; }
  .qa:last-child { margin-bottom: 0; }
  .qa .q-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .qa .q { font-weight: 600; font-size: 14px; flex: 1; }
  .qa .a { font-size: 13.5px; color: var(--text-2); }
  .impact-pill { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 100px; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.03em; }
  .impact-pill.high { background: color-mix(in srgb, var(--critical) 16%, var(--surface)); color: var(--critical); }
  .impact-pill.medium { background: color-mix(in srgb, var(--warning) 22%, var(--surface)); color: color-mix(in srgb, var(--warning) 70%, #3a2a00); }
  .impact-pill.low { background: color-mix(in srgb, var(--good) 18%, var(--surface)); color: color-mix(in srgb, var(--good) 65%, #063600); }
  .qa.impact-high { border-left-color: var(--critical); }
  .qa.impact-medium { border-left-color: var(--warning); }
  .qa.impact-low { border-left-color: var(--good); }

  /* chosen direction */
  .chosen-card {
    background: color-mix(in srgb, var(--accent) 8%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border));
    border-radius: 12px; padding: 18px 20px; box-shadow: var(--shadow);
  }
  .chosen-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); font-weight: 700; margin-bottom: 6px; }
  .chosen-card .text { font-size: 14.5px; color: var(--text); }

  /* next step footer */
  .next-step {
    border: 1px dashed var(--border); border-radius: 12px; padding: 14px 18px;
    font-size: 13.5px; color: var(--text-2); background: var(--surface);
  }
  .next-step code { background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; color: var(--text); }

  .skip-note {
    border: 1px dashed var(--border); border-radius: 12px; padding: 18px 20px;
    color: var(--text-2); font-size: 14px; text-align: center;
  }

  @media (max-width: 640px) {
    .finding-grid { grid-template-columns: 1fr; }
    table.intervention, table.intervention thead, table.intervention tbody, table.intervention tr { display: block; }
    table.intervention thead { display: none; }
    table.intervention td { display: block; border-bottom: none; padding: 4px 0; }
    table.intervention tr { padding: 10px 0; border-bottom: 1px solid var(--grid); }
    table.intervention td:first-child { font-weight: 600; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <span class="brand">DISCOVERY</span>
    <button class="icon-btn" id="theme-toggle" type="button">Theme</button>
  </div>

  <div class="wrap">
    <header class="hero">
      <h1 id="d-title"></h1>
      <div class="meta" id="d-meta"></div>
      <div class="mode-badges" id="mode-badges"></div>
    </header>

    <section id="section-blindspot" style="display:none">
      <h2 class="section-title">Blind spot pass</h2>
      <div id="blindspot-body"></div>
    </section>

    <section id="section-brainstorm" style="display:none">
      <h2 class="section-title">Brainstorm &amp; prototype</h2>
      <div id="intervention-block" style="display:none">
        <h3 class="sub-title">Intervention points</h3>
        <div class="card"><div id="intervention-card"></div></div>
      </div>
      <div id="mockup-block" style="display:none">
        <h3 class="sub-title">Design directions</h3>
        <div class="mockup-grid" id="mockup-grid"></div>
      </div>
    </section>

    <section id="section-interview" style="display:none">
      <h2 class="section-title">Interview</h2>
      <div class="card" id="interview-card"></div>
    </section>

    <section id="section-chosen" style="display:none">
      <h2 class="section-title">Chosen direction</h2>
      <div class="chosen-card">
        <div class="label">Recommendation</div>
        <div class="text" id="chosen-text"></div>
      </div>
    </section>

    <section id="section-empty" style="display:none">
      <div class="skip-note">No discovery modes were run for this topic - it was well understood going in. Proceed straight to <code>/to-plan</code>.</div>
    </section>

    <section>
      <div class="next-step" id="next-step"></div>
    </section>
  </div>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-inner">
      <div class="lightbox-head">
        <div><h3 id="lightbox-title"></h3><p id="lightbox-desc"></p></div>
        <button class="lightbox-close" id="lightbox-close" type="button">Close</button>
      </div>
      <iframe id="lightbox-frame" sandbox="allow-scripts"></iframe>
    </div>
  </div>

<script>
/* DISCOVERY_DATA_START - replace everything between these two markers with the real discovery data */
const DISCOVERY_DATA = {
  topic: "Example: Rate limit the public API",
  topicSlug: "rate-limit-public-api",
  generatedAt: "2026-07-27",
  modesRun: ["blind-spot", "brainstorm", "interview"],

  blindSpots: {
    assumptions: [
      { text: "Assumes every caller of the public API authenticates with a bearer token.", risk: "An unauthenticated internal caller would get rate-limited unexpectedly.", howToVerify: "Grep for routes mounted before the auth middleware." }
    ],
    adjacentSystems: [
      { name: "billing-service", note: "Reads response headers for usage metering; adding 429s changes what it sees." }
    ],
    priorArt: [
      { pattern: "Token-bucket limiter", where: "src/internal/jobQueue/throttle.js", note: "Already solves this for the job queue; reuse instead of a new algorithm." }
    ],
    openQuestions: [
      { question: "Should limits be per-API-key or per-IP?", whyItMatters: "Per-key needs the auth layer wired in first; per-IP does not." }
    ]
  },

  interventionPoints: [
    { option: "Fixed global rate limit", effort: "cheap", whatChanges: "One middleware, one number, no storage.", tradeoff: "Unfair to high-volume legitimate callers." },
    { option: "Per-API-key token bucket", effort: "moderate", whatChanges: "Middleware plus a small Redis-backed bucket per key.", tradeoff: "Needs the auth layer to expose a stable key." },
    { option: "Tiered plans with burst allowance", effort: "ambitious", whatChanges: "Bucket sizing driven by the billing plan.", tradeoff: "Couples rate limiting to billing state; more moving parts to keep in sync." }
  ],

  mockups: [
    { title: "Direction A: banner warning", description: "Header shows remaining quota as a slim bar.", html: "<body style='font-family:sans-serif;padding:20px;color:#333'>Placeholder mockup A</body>" },
    { title: "Direction B: dashboard tile", description: "Quota surfaced as its own tile on the API dashboard.", html: "<body style='font-family:sans-serif;padding:20px;color:#333'>Placeholder mockup B</body>" }
  ],

  interview: [
    { question: "Per-API-key or per-IP?", answer: "Per-API-key - we already require auth on every public route.", architecturalImpact: "high" },
    { question: "Should 429s carry a Retry-After header?", answer: "Yes, callers already expect it from other services.", architecturalImpact: "low" }
  ],

  chosenDirection: "Per-API-key token bucket (moderate effort): reuses the existing throttle pattern from the job queue, and per-key is unblocked now that auth exposes a stable identifier."
};
/* DISCOVERY_DATA_END */

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function mdLite(s) {
  if (!s) return "";
  let h = escapeHtml(s);
  h = h.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  return h.split(/\n\n+/).map(p => "<p style='margin:0 0 8px'>" + p.replace(/\n/g, "<br>") + "</p>").join("");
}

// ---- theme toggle (auto -> light -> dark -> auto), best-effort persisted ----
(function themeInit() {
  const key = "discover-theme";
  let saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
  document.getElementById("theme-toggle").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : cur === "light" ? null : "dark";
    if (next) document.documentElement.setAttribute("data-theme", next);
    else document.documentElement.removeAttribute("data-theme");
    try { next ? localStorage.setItem(key, next) : localStorage.removeItem(key); } catch (e) {}
  });
})();

const MODE_LABELS = { "blind-spot": "Blind spot pass", "brainstorm": "Brainstorm + prototype", "interview": "Interview" };
const modesRun = DISCOVERY_DATA.modesRun || [];

// ---- header ----
document.getElementById("d-title").textContent = DISCOVERY_DATA.topic || "Discovery";
document.title = (DISCOVERY_DATA.topic || "Discovery") + " - Discovery";
document.getElementById("d-meta").textContent = "Generated " + (DISCOVERY_DATA.generatedAt || "");
const badgeWrap = document.getElementById("mode-badges");
["blind-spot", "brainstorm", "interview"].forEach(m => {
  const span = document.createElement("span");
  span.className = "mode-badge" + (modesRun.includes(m) ? " ran" : "");
  span.textContent = MODE_LABELS[m];
  badgeWrap.appendChild(span);
});

// ---- blind spot pass ----
const bs = DISCOVERY_DATA.blindSpots || {};
const bsCategories = [
  { key: "assumptions", title: "Unverified assumptions", render: f => ({
      primary: mdLite(f.text), detail: [f.risk ? "<b>Risk:</b> " + mdLite(f.risk) : "", f.howToVerify ? "<b>Verify:</b> " + mdLite(f.howToVerify) : ""].filter(Boolean)
    }) },
  { key: "adjacentSystems", title: "Adjacent systems &amp; consumers", render: f => ({
      primary: mdLite(f.name), detail: [f.note ? mdLite(f.note) : ""].filter(Boolean)
    }) },
  { key: "priorArt", title: "Prior art", render: f => ({
      primary: mdLite(f.pattern), detail: [f.where ? "<b>Where:</b> " + mdLite(f.where) : "", f.note ? mdLite(f.note) : ""].filter(Boolean)
    }) },
  { key: "openQuestions", title: "Open questions", render: f => ({
      primary: mdLite(f.question), detail: [f.whyItMatters ? "<b>Why it matters:</b> " + mdLite(f.whyItMatters) : ""].filter(Boolean)
    }) }
];
let blindSpotHasContent = false;
const bsBody = document.getElementById("blindspot-body");
bsCategories.forEach(cat => {
  const items = bs[cat.key] || [];
  if (!items.length) return;
  blindSpotHasContent = true;
  const h3 = document.createElement("h3");
  h3.className = "sub-title";
  h3.innerHTML = cat.title;
  bsBody.appendChild(h3);
  const grid = document.createElement("div");
  grid.className = "finding-grid";
  items.forEach(item => {
    const r = cat.render(item);
    const card = document.createElement("div");
    card.className = "finding";
    card.innerHTML = "<div class='primary'>" + r.primary + "</div>" + r.detail.map(d => "<div class='detail'>" + d + "</div>").join("");
    grid.appendChild(card);
  });
  bsBody.appendChild(grid);
});
if (modesRun.includes("blind-spot") && blindSpotHasContent) {
  document.getElementById("section-blindspot").style.display = "";
}

// ---- brainstorm + prototype ----
const points = DISCOVERY_DATA.interventionPoints || [];
const mockups = DISCOVERY_DATA.mockups || [];
if (modesRun.includes("brainstorm") && (points.length || mockups.length)) {
  document.getElementById("section-brainstorm").style.display = "";

  if (points.length) {
    document.getElementById("intervention-block").style.display = "";
    document.getElementById("intervention-card").innerHTML =
      "<table class='intervention'><thead><tr><th>Option</th><th>Effort</th><th>What changes</th><th>Tradeoff</th></tr></thead><tbody>" +
      points.map(p => "<tr><td>" + escapeHtml(p.option) + "</td><td><span class='effort-pill " + escapeHtml(p.effort || "cheap") + "'>" + escapeHtml(p.effort || "") + "</span></td><td>" + mdLite(p.whatChanges) + "</td><td>" + mdLite(p.tradeoff) + "</td></tr>").join("") +
      "</tbody></table>";
  }

  if (mockups.length) {
    document.getElementById("mockup-block").style.display = "";
    const grid = document.getElementById("mockup-grid");
    mockups.forEach((m, idx) => {
      const card = document.createElement("div");
      card.className = "mockup";
      const frame = document.createElement("iframe");
      frame.sandbox = "allow-scripts";
      frame.srcdoc = m.html || "<p style='font-family:sans-serif;padding:20px;color:#888'>No markup provided.</p>";
      card.appendChild(frame);
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.innerHTML = "<h3>" + escapeHtml(m.title || ("Direction " + (idx + 1))) + "</h3><p>" + escapeHtml(m.description || "") + "</p>";
      card.appendChild(meta);
      card.addEventListener("click", () => openLightbox(m));
      grid.appendChild(card);
    });
  }
}

function openLightbox(m) {
  document.getElementById("lightbox-title").textContent = m.title || "";
  document.getElementById("lightbox-desc").textContent = m.description || "";
  document.getElementById("lightbox-frame").srcdoc = m.html || "";
  document.getElementById("lightbox").classList.add("show");
}
function closeLightbox() { document.getElementById("lightbox").classList.remove("show"); }
document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
document.getElementById("lightbox").addEventListener("click", (e) => { if (e.target.id === "lightbox") closeLightbox(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeLightbox(); });

// ---- interview ----
const interview = DISCOVERY_DATA.interview || [];
if (modesRun.includes("interview") && interview.length) {
  document.getElementById("section-interview").style.display = "";
  document.getElementById("interview-card").innerHTML = interview.map(qa => {
    const impact = qa.architecturalImpact || "low";
    return "<div class='qa impact-" + escapeHtml(impact) + "'>" +
      "<div class='q-row'><span class='q'>" + mdLite(qa.question) + "</span><span class='impact-pill " + escapeHtml(impact) + "'>" + escapeHtml(impact) + "</span></div>" +
      "<div class='a'>" + mdLite(qa.answer) + "</div></div>";
  }).join("");
}

// ---- chosen direction ----
if (DISCOVERY_DATA.chosenDirection) {
  document.getElementById("section-chosen").style.display = "";
  document.getElementById("chosen-text").innerHTML = mdLite(DISCOVERY_DATA.chosenDirection);
}

// ---- empty state ----
if (!modesRun.length) {
  document.getElementById("section-empty").style.display = "";
}

// ---- next step ----
const slug = DISCOVERY_DATA.topicSlug || "topic-slug";
document.getElementById("next-step").innerHTML =
  "Next: run <code>/to-plan</code> and reuse <code>" + escapeHtml(slug) + "</code> as the plan name, so it picks up <code>" + escapeHtml(slug) + "-discovery-notes.md</code> automatically.";
</script>
</body>
</html>
